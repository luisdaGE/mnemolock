    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "MindLatch",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Web, iOS, Android",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },

      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Como desbloquea MindLatch una sesion de estudio?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "En lugar de un boton de salida, MindLatch te hace responder preguntas cortas sobre lo que acabas de estudiar. Sales cuando demuestras que aprendiste."
            }
          },
          {
            "@type": "Question",
            "name": "Necesito crear una cuenta para probarlo?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No. Puedes iniciar una demo de bloqueo en menos de 30 segundos sin registrarte."
            }
          },
          {
            "@type": "Question",
            "name": "MindLatch puede bloquear otras apps del celular?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "La version web/PWA crea un bloqueo cognitivo durante la sesion. El bloqueo total del sistema operativo llegara con la app nativa."
            }
          }
        ]
      }
